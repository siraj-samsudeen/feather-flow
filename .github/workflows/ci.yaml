name: CI

# This repo had no CI at all until issue #83. `.python-version` was committed as
# 3.14, which removed `ssl.PROTOCOL_TLSv1`; `mysql-connector-python` could not
# import, pytest could not even *collect*, and nobody noticed because nothing
# was watching `main`.
#
# `astral-sh/setup-uv` is pinned to an exact release because it stopped
# publishing floating major tags after v7 — `@v10` does not resolve.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interpreter-guard:
    name: Interpreter pin is a version we claim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      # `--no-project` keeps this independent of the project's own dependencies
      # — it must still run when they are the thing that is broken. The explicit
      # `--python` overrides `.python-version`, which is the file under test.
      - name: Check .python-version against the declared support
        run: uv run --no-project --python 3.13 scripts/check_pinned_python_version.py

  test:
    name: pytest (Python ${{ matrix.python-version }})${{ matrix.experimental && ' - non-blocking' || '' }}
    runs-on: ubuntu-latest
    # Only the `experimental` entries below may fail the job without failing CI.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.12 and 3.13 only, since #85. 3.10 was advertised but never green
          # (22 failures from import-order pollution in tests/unit/sources), and
          # the floor was raised rather than the pollution fixed.
          #
          # 3.12 is the FLOOR and must stay tested: every service in
          # JeyaramaGroup/data-warehouse that consumes `feather-control-plane`
          # declares `>=3.12`, and that repo is capped `>=3.12,<3.13`. Dropping
          # 3.12 here would mean publishing a package nobody downstream can
          # install, untested.
          #
          # 3.14 is the CEILING: `ssl.PROTOCOL_TLSv1` was removed, so
          # `mysql-connector-python` cannot import and pytest cannot collect.
          # That is a feather-flow-core limit — the control-plane member passes
          # on 3.14 — so revisit when that dependency does.
          - python-version: "3.12"
            experimental: false
          - python-version: "3.13"
            experimental: false
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          # Sets UV_PYTHON, which outranks `.python-version` for both commands
          # below — so the matrix really does vary the interpreter.
          python-version: ${{ matrix.python-version }}

      # `--all-extras` is required, not a nicety: without the `connectorx` extra
      # collection dies on tests/unit/transports/test_connectorx_transport.py.
      - name: Install dependencies
        run: uv sync --all-extras

      # The PostgreSQL- and MySQL-gated tests skip here (no local servers on the
      # runner) and the suite still exits 0 — see docs/CONTRIBUTING.md. The
      # workspace members get a real PostgreSQL in the job below.
      - name: Run tests
        run: uv run pytest -q

  # Workspace members are gated separately: they version and release on their own
  # cadence, and most of their tests need a real database, which feather-flow's
  # own suite does not. Path-filtered via `paths` would skip the job entirely and
  # leave a required check pending, so the filter lives in the step condition.
  feather-control-plane:
    name: pytest (feather-control-plane)
    runs-on: ubuntu-latest
    services:
      # `conftest.py` prefers CONTROL_PG_DSN over spawning Docker or a local
      # pg_ctl, so handing it a service container is the one path that needs no
      # privileged runner. 33 of the 44 tests exercise real SQL — schema
      # creation, concurrent writers and LISTEN/NOTIFY — and prove nothing
      # against a mock.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: control_plane_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      # `working-directory`, NOT `uv run --package … pytest` from the repo root:
      # pytest takes its config from the nearest pyproject.toml above the CWD, so
      # from the root `--package` selects the environment and still runs
      # feather-flow's 1094 tests. A green run that tested the wrong thing is
      # worse than a red one.
      - name: Run the package's suite against a real PostgreSQL
        working-directory: packages/feather-control-plane
        env:
          CONTROL_PG_DSN: postgresql://postgres:postgres@localhost:5432/control_plane_test
        run: uv run --package feather-control-plane pytest -q
