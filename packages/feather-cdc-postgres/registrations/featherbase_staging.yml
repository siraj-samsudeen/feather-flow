# Featherbase STAGING (Railway project jeyarama-featherbase, environment `staging`, service
# `Postgres`) -> MotherDuck bronze_featherbase_staging (#4617). The stable environment where
# business users validate master data before production (#4588); dev keeps rehearsing releases.
#
# A deliberate copy of featherbase_dev.yml: same deny list, routing and owner as production, its
# own identity keys. pg_md_cdc/tests/test_featherbase_staging_registration.py enforces both.
api_version: pg-md-cdc/v1
source_id: featherbase_staging
# Must equal the Railway environment the worker runs in; `run` refuses otherwise (#4340).
environment: staging

source:
  dsn_env: FEATHERBASE_PG_DSN
  include:
    # The adapter remains the allow-list: platform tables live in `featherbase`, while each
    # installed app can own its physical schema (`tasker` today). Unrelated relations such as
    # public.site are not catalog-declared and therefore cannot enter the compiled set.
    schemas: ["*"]
  exclude:
    tables:
      # persist_snapshots left 50 of these in the SOURCE schema (#2874); never replicate them.
      - "public._dlt_*"
  deny:
    tables:
      # Credential/PII tables. Not catalog-declared today, so the adapter never offers them —
      # this is the tripwire that makes a future catalog change fail validate instead of leaking.
      - "featherbase.access_token"
      - "featherbase.password_reset"
      - "featherbase.user_settings"
      # The Person release (featherbase 0101 + 0102, #4338): sign-in links, the old->new id
      # map, service accounts and merge history never leave Featherbase; fingerprints are
      # never mirrored (person-resolution D3/D10). `person_identifier` holds identifier VALUES
      # and stays denied until Phase 2 (featherbase docs/DEPLOY.md, person release step 9).
      - "featherbase.sign_in_identity"
      - "featherbase.person_id_map"
      - "featherbase.service_account"
      - "featherbase.person_identifier"
      - "featherbase.person_identifier_fingerprint"
      - "featherbase.person_merge"
    columns:
      # Never leaves the CDC process (#4346) — the same deny as production's, so the staging mirror
      # never carries the hash either. NOT a publication column list: under replica_identity:
      # full that list must name every column, or every UPDATE/DELETE fails at the source.
      "featherbase.person": [password_hash]
      # Staging has no access.user copy (fresh install); kept so the deny list stays identical
      # to production's.
      "featherbase.user": [password_hash]
  discovery:
    adapter: featherbase
    options:
      schema: featherbase
      modules: null          # null = every module; a list narrows and DROPS the rest from the pub
      # Two-way rule (Siraj, 05-Sep-2026): every user-created table (`table_def."system" = false`)
      # flows with no edit here; Featherbase's own tables flow ONLY when named below.
      # Navigation (home_page*), scheduler (background_job, job_execution) and `version` are
      # deliberately out. Adding a name later is safe: a newly selected table gets a full baseline.
      system_tables:
        - table_def
        - column_def
        - person              # was `user` until featherbase 0101 renamed it (#4338)
        - identifier_system   # identifier namespaces, no values (person-resolution D2/D10)
        - role
        - has_role
        - permission
        - data_scope
        - share
        - activity_log
        - user_event
        - comment

destination:
  token_env: MOTHERDUCK_TOKEN
  # The MotherDuck account the token must sign in as (#4427); run/resnapshot refuse otherwise.
  owner: featherbase_cdc_service_account
  # Never bronze_featherbase. Written by featherbase_cdc_service_account — production's owner, by
  # Siraj's ruling (23-Oct-2026) — so the separation is in code: validate requires the `_staging`
  # suffix, and run/resnapshot refuse any database a production registration writes.
  database: bronze_featherbase_staging
  schema_mapping: preserve_source
  # Per-table bronze schemas, first match wins. Platform tables live in `featherbase`; app
  # tables retain their physical source schema until this final domain routing step.
  table_schemas:
    - {match: "featherbase.table_def", schema: catalog}
    - {match: "featherbase.column_def", schema: catalog}
    # `user` is RETIRED (renamed to `person` by featherbase 0101). The rule stays so WAL
    # written under the old name before the rename lands in the frozen access.user copy, not
    # in `application`; delete it once that copy is dropped (#4338).
    # Staging: no access.user copy exists (this mirror starts on a fresh install); the rule is
    # kept only so the routing stays identical to production's.
    - {match: "featherbase.user", schema: access}
    - {match: "featherbase.person", schema: access}
    - {match: "featherbase.identifier_system", schema: access}
    - {match: "featherbase.role", schema: access}
    - {match: "featherbase.has_role", schema: access}
    - {match: "featherbase.permission", schema: access}
    - {match: "featherbase.data_scope", schema: access}
    - {match: "featherbase.share", schema: access}
    - {match: "featherbase.activity_log", schema: activity}
    - {match: "featherbase.user_event", schema: activity}
    - {match: "featherbase.comment", schema: activity}
    # Adapter-selected relations not named above are catalog-declared app/user tables.
    - {match: "*.*", schema: application}
  retirement_policy: freeze

replication:
  # Distinct from production's and dev's names: a staging worker pointed at another DB by mistake
  # creates its own slot instead of consuming that database's WAL.
  slot: featherbase_staging_cdc_slot
  publication: featherbase_staging_cdc_pub
  cadence_minutes: 60        # generated from config/schedules.yml (pg-md-cdc-featherbase-staging)
  tables_without_key: reject
  # Unchanged TOASTed values only ride the WAL under FULL; without it a large unchanged column
  # is undecodable on UPDATE. Cost: the whole old row is written on every UPDATE/DELETE.
  replica_identity: full
  slot_loss_policy: resnapshot
  target_batch_size: 1000

control:
  # Its own extractor, logged to the DEV instance of the CDC log DB (jeyarama-cdc-log-db in
  # project jeyarama-cdc, environment `dev`), like the dev mirror: no credential that can write a
  # production run row (#4340, #4617).
  extractor: featherbase_staging
  availability_policy: pause_if_control_unreachable
  event_durability: direct_postgres
