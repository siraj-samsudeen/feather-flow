# Webhook landing Postgres (`jeyarama-webhook-landing-db`), schema petpooja -> MotherDuck
# bronze_petpooja.webhook (#4272 D27). One schema per receiver on the shared landing database;
# each receiver gets its own registration, slot and publication, into its own system's bronze.
api_version: pg-md-cdc/v1
source_id: petpooja_webhook
# Must equal the Railway environment the worker runs in; `run` refuses otherwise (#4340).
environment: production

source:
  dsn_env: WEBHOOK_PG_DSN
  include:
    schemas: [petpooja]
  deny:
    columns:
      # Postgres-only (petpooja_webhook/store.py POSTGRES_ONLY_COLUMNS): raw_body holds the body
      # token and the guest's details, request_path the URL secret. `payload` is the warehouse
      # copy, with both removed by the receiver.
      petpooja.bills: [raw_body, request_path, headers, source_ip]

destination:
  token_env: MOTHERDUCK_TOKEN
  # The MotherDuck account the token must sign in as (#4427); run/resnapshot refuse otherwise.
  # bronze_petpooja's owner, shared with the nightly pull (bronze_petpooja.pull.bills, D29).
  owner: petpooja_extract
  database: bronze_petpooja
  schema_mapping:
    petpooja: webhook
  retirement_policy: freeze

replication:
  slot: petpooja_webhook_cdc_slot
  publication: petpooja_webhook_cdc_pub
  cadence_minutes: 5        # generated from config/schedules.yml (pg-md-cdc)
  tables_without_key: reject
  replica_identity: full
  slot_loss_policy: resnapshot
  target_batch_size: 1000

control:
  # The dbt-runner listens for this name (#4272 A4, D30): do not rename.
  extractor: petpooja_webhook_cdc
  availability_policy: pause_if_control_unreachable
  event_durability: direct_postgres
  # The receiver inserts a bill every ~18 s, so source-now never ties destination-now within a
  # run: the reconcile would report an error, the run would finish `partial`, and the #4024
  # trigger (which fires only on a finish `ok`) would never notify the dbt-runner (D30).
  reconcile_exclude:
    - "petpooja.bills"
