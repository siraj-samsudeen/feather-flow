# Railway control plane (`Postgres`, control.*) -> MotherDuck bronze_control_plane (#3079 D10, #2870).
api_version: pg-md-cdc/v1
source_id: control_plane
# Must equal the Railway environment the worker runs in; `run` refuses otherwise (#4340).
environment: production

source:
  dsn_env: CONTROL_PG_DSN
  include:
    schemas: [control]       # a stray `landing` schema exists on the same server; not ours
  exclude:
    tables:
      # A heartbeat row UPDATEd every minute per extractor: no history, retires under #2845.
      - "control.lease"
      # Empty since the SAP migration; replicating them would create two dead bronze tables.
      - "control.sap_run_events_legacy"
      - "control.sap_partition_grid_legacy"

destination:
  token_env: MOTHERDUCK_TOKEN
  database: bronze_control_plane
  schema_mapping: preserve_source
  retirement_policy: freeze

replication:
  slot: control_plane_cdc_slot
  publication: control_plane_cdc_pub
  cadence_minutes: 5        # generated from config/schedules.yml (pg-md-cdc)
  tables_without_key: reject
  key_overrides:
    # No primary key at the source and no unique index; both are append-only fact streams.
    # append_only means the CDC path merges on `lsn` (unique per WAL record) so a replayed
    # batch is exact, an UPDATE lands as an additional row version, and a DELETE removes
    # nothing. Re-baselining one REPLACES the destination copy at a consistent point whose
    # boundary the drain honours, so the overlap with the WAL lands once (runbook §c).
    control.sap_reconcile: append_only
    control.zakya_quarantine: append_only
  replica_identity: full
  slot_loss_policy: resnapshot
  target_batch_size: 1000

control:
  # Distinct identity (D10): this drainer's own run rows are ordinary source changes here.
  extractor: control_plane_cdc
  availability_policy: pause_if_control_unreachable
  event_durability: direct_postgres
  # The batch extractors write these three tables continuously, so a source-now vs
  # destination-now count can never tie; reconciling them would emit EV_ERROR every tick.
  # (Before #4078 this drainer also wrote them itself; it now logs to its own CDC log DB.)
  reconcile_exclude:
    - "control.run"
    - "control.event"
    - "control.budget_usage"
