[project]
name = "feather-cdc-postgres"
version = "0.1.0"
description = "Declarative PostgreSQL -> MotherDuck CDC runtime: one registration file per source database, no per-source extractor"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Siraj Samsudeen", email = "mailsiraj@gmail.com" }
]
# The distribution is `feather-cdc-postgres` and so is the IMPORT name,
# `feather_cdc_postgres`. This differs from feather-control-plane, which kept its old import
# name on purpose: ~40 call sites already said `from control_plane import ...`. Nothing outside
# this tree imports `pg_md_cdc` — the only external references are twelve `python -m pg_md_cdc`
# command strings — so there was no adoption cost to paying off the acronym here.
#
# `>=3.12` matches feather-control-plane and the feather-flow root. uv locks a workspace at the
# INTERSECTION of its members' ranges, so all three move together (#85).
requires-python = ">=3.12"
keywords = ["cdc", "postgresql", "logical-replication", "motherduck", "duckdb", "etl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
]
dependencies = [
    # The run log. A workspace dependency (see [tool.uv.sources]) so the two version together
    # in-repo. The CDC writes real run/event/budget rows through it — ~50 `cp_status.*`
    # constants and a `ControlPlane` factory with four call sites in runner.py. What #4078
    # decoupled was the DATABASE (this logs to its own CDC log DB via CDC_LOG_PG_DSN), not the
    # client library; a different DSN satisfies that.
    # Bounded below 0.2 deliberately. `[tool.uv.sources]` makes this the local member in-repo, but
    # uv strips sources from published metadata, so an unbounded spec would let a released CDC pick
    # up any future control plane. This uses its internals — ~50 `cp_status.*` constants and the
    # `ControlPlane` factory — and pre-1.0 a minor is where breakage is allowed to land.
    "feather-control-plane[postgres]>=0.1.0,<0.2",
    # sql_database extra is a real requirement of the vendored pg_replication source
    # (upstream dlt-hub/verified-sources#685 — `dlt init` ships incomplete requirements).
    "dlt[motherduck,sql_database]>=1.0.0",
    # Pin EXACT — an open top end lets a rebuild grab a duckdb MotherDuck has no extension
    # build for, which fails at CONNECT time and reads like an outage.
    "duckdb==1.5.2",
    # pgoutput replication protocol lives in psycopg2 only (psycopg3 has no replication
    # support) — used by the vendored pg_replication source.
    "psycopg2-binary>=2.9.9",
    # Source catalog reads and the advisory owner session.
    "psycopg[binary]>=3.1",
    # Registration manifests are YAML.
    "pyyaml>=6.0",
]

[project.scripts]
feather-cdc-postgres = "feather_cdc_postgres.cli:main"

[project.urls]
Homepage = "https://github.com/siraj-samsudeen/feather-flow"
Repository = "https://github.com/siraj-samsudeen/feather-flow"
Issues = "https://github.com/siraj-samsudeen/feather-flow/issues"

[tool.uv.sources]
feather-control-plane = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `pg_replication` ships beside the runtime: it is vendored third-party code (Apache-2.0,
# dlt-hub/verified-sources), not an implementation detail that could be imported from PyPI —
# the upstream is a `dlt init` template, not a distribution. src/pg_replication/README.md
# carries the attribution.
packages = ["src/feather_cdc_postgres", "src/pg_replication"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "pyproject.toml"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
