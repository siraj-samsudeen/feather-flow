[project]
name = "control-plane"
version = "0.1.0"
description = "Durable failure observability for the extractor fleet: WAL + Postgres control plane + liveness lease (issue #204)"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_plane"]
